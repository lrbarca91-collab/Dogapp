<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Rescue App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID"></script>
</head>
<body>

    <div class="app-container">

        <h1>Find Your Dog</h1>

        <div id="card-container"></div>

    </div>

    <!-- Sponsor Modal -->
    <div id="sponsorModal" class="modal hidden">
        <div class="modal-content">
            <h2>Sponsor This Dog</h2>

            <input type="number" id="sponsorAmount" placeholder="Enter amount in USD" min="1" step="0.01">
            <input type="text" id="sponsorName" placeholder="Your Name" required>

            <div id="paypal-button-container" style="margin: 20px 0;"></div>

            <button onclick="closeSponsorModal()" style="margin-top: 10px;">Close</button>
        </div>
    </div>

    <!-- Adoption Modal -->
    <div id="adoptionModal" class="modal hidden">
        <div class="modal-content">
            <h2>Adoption Application</h2>

            <form id="adoptionForm" onsubmit="submitAdoption(event)">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="number" id="age" placeholder="Age" required>
                <input type="text" id="address" placeholder="Address" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phone" placeholder="Phone Number" required>

                <button type="submit">Submit Application</button>
            </form>

            <button onclick="closeAdoptionModal()">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
